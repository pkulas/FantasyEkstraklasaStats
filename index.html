<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skrypt do Fantasy Ekstraklasa</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <!-- Clipboard.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>

</head>
<body>
 <div class="code-container">
    <button class="copy-btn" data-clipboard-target="#code-block">Kopiuj</button>
    <pre><code id="code-block" class="language-javascript">
    </code></pre>
  </div>


<script>
        fetch('script.js')
      .then(response => response.text())
      .then(code => {
        // Wstaw kod do elementu <code>
        document.getElementById('code-block').textContent = code;

       hljs.highlightAll();

    // Inicjalizacja Clipboard.js
    new ClipboardJS('.copy-btn');

      })
      .catch(error => console.error('Błąd podczas ładowania pliku:', error));

</script>
</body>
</html>

</html>
